name: Enforce Branch Naming Convention

on:
  pull_request:
    branches:
      - main
      - dev
      - uat

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Checking branch name: $BRANCH_NAME"
          
          if [[ ! "$BRANCH_NAME" =~ ^(main|dev|uat|feature/(dev|uat|main)/[a-zA-Z0-9_-]+|hotfix/[a-zA-Z0-9_-]+)$ ]]; then
            echo "::error::Branch name does not follow convention. Expected format: feature/<dev|uat|main>/<feature-name>, hotfix/<fix>, or a core branch (main, dev, uat)."
            exit 1
          fi
          echo "Branch name is valid!"
